<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="360" viewBox="0 0 1080 360" role="img" aria-labelledby="title desc">
  <title id="title">CloudAI mushroom baseline workflow</title>
  <desc id="desc">The verified 5,000-row mushroom dataset is split into 3,000 training, 1,000 validation and 1,000 reserved test rows. Training-fitted preprocessing and a random forest are saved as a pipeline and used by a local API and browser form.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#667b70"/></marker></defs>
  <rect width="1080" height="360" rx="18" fill="#f3f6f1"/>
  <g font-family="Arial, sans-serif" fill="#183b2a">
    <text x="30" y="40" font-size="21" font-weight="700">From course data to a local prediction</text>
    <text x="30" y="65" font-size="14" fill="#597063">Working baseline. Model selection, cloud training and hosting come next.</text>
    <g fill="#ffffff" stroke="#cbd8cf" stroke-width="1.5">
      <rect x="30" y="98" width="180" height="86" rx="10"/>
      <rect x="250" y="98" width="200" height="86" rx="10"/>
      <rect x="490" y="98" width="240" height="86" rx="10"/>
      <rect x="770" y="98" width="280" height="86" rx="10"/>
      <rect x="250" y="232" width="200" height="90" rx="10" stroke-dasharray="6 4"/>
      <rect x="490" y="232" width="240" height="90" rx="10"/>
      <rect x="770" y="232" width="280" height="90" rx="10"/>
    </g>
    <g stroke="#667b70" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M210 141H240"/><path d="M450 141H480"/><path d="M730 141H760"/>
      <path d="M350 184V222"/><path d="M910 184V204H610V222"/><path d="M730 277H760"/>
    </g>
    <text x="48" y="126" font-size="16" font-weight="700">Replacement CSV</text>
    <text x="48" y="150" font-size="14">5,000 rows · 12 inputs</text>
    <text x="48" y="170" font-size="13" fill="#597063">Pinned source + SHA-256</text>
    <text x="268" y="126" font-size="16" font-weight="700">Stratified split</text>
    <text x="268" y="150" font-size="14">3,000 training rows</text>
    <text x="268" y="170" font-size="14">1,000 validation rows</text>
    <text x="508" y="126" font-size="16" font-weight="700">Fit on training only</text>
    <text x="508" y="150" font-size="14">Imputation + encoding</text>
    <text x="508" y="170" font-size="14">Baseline model training</text>
    <text x="788" y="126" font-size="16" font-weight="700">Compare on validation</text>
    <text x="788" y="150" font-size="14">Accuracy, recall, precision, F1</text>
    <text x="788" y="170" font-size="14">Inspect errors and limitations</text>
    <text x="268" y="260" font-size="16" font-weight="700">Reserved final test</text>
    <text x="268" y="285" font-size="14">1,000 untouched rows</text>
    <text x="268" y="305" font-size="13" fill="#597063">Evaluate after choices freeze</text>
    <text x="508" y="260" font-size="16" font-weight="700">Saved forest pipeline</text>
    <text x="508" y="285" font-size="14">Preprocessing + estimator</text>
    <text x="508" y="305" font-size="13" fill="#597063">Recreated by the training script</text>
    <text x="788" y="260" font-size="16" font-weight="700">Local inference</text>
    <text x="788" y="285" font-size="14">JSON API → browser form</text>
    <text x="788" y="305" font-size="13" fill="#597063">No cloud deployment yet</text>
  </g>
</svg>
