name: Review model build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mushrooms/**'
      - 'citibike/**'
      - 'common/**'
      - 'src/**'
      - 'app/**'
      - 'models/**'
      - 'examples/**'
      - 'data/*.csv'
      - 'scripts/**'
      - 'requirements-review*.txt'
      - 'Dockerfile'
      - 'render.yaml'
      - 'release_decision.json'
      - 'reports/final_test_results.json'
      - '.github/workflows/review-release.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Install CPU requirements
        run: |
          python -m pip install -r requirements-review-linux.lock.txt
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Rebuild CPU models with training data only
        run: python scripts/rebuild_review_models.py --output-root build
      - name: Check candidates and assemble the release
        run: |
          python scripts/assemble_hosting.py --candidate-root build
          if [ -f release_decision.json ]; then
            python scripts/verify_review.py --mode frozen
          else
            python scripts/verify_review.py --mode rebuilt
          fi
          docker build -t cloudai-review .
      - uses: actions/upload-artifact@v4
        with:
          name: cloudai-review-${{ github.sha }}
          path: |
            models/
            build/build_record.json
            reports/review_verification.json
            release_decision.json
            reports/final_test_results.json
          if-no-files-found: error
          retention-days: 14
      - name: Deploy the checked commit if configured
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_WEBHOOK: ${{ secrets.DEPLOY_WEBHOOK }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK" ]; then
            curl --fail --silent --show-error --retry 2 --output /dev/null \
              -X POST "${DEPLOY_WEBHOOK}&ref=${RELEASE_COMMIT}"
          else
            echo 'Build passed. Configure DEPLOY_WEBHOOK for this Render service.'
          fi
